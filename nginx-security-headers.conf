# Security headers, kept in one file.
#
# nginx does NOT inherit add_header into a location that sets its own add_header.
# Previously these lived at server level and silently vanished inside /static/
# and / , which set caching headers. Every location now includes this snippet.

add_header X-Frame-Options           "SAMEORIGIN"                        always;
add_header X-Content-Type-Options    "nosniff"                           always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                      always;

# HSTS only means anything over HTTPS; it is set in the 443 server block.

# Content-Security-Policy.
#   script-src  'self' only: React, ReactDOM and Leaflet are vendored locally.
#   style-src   needs 'unsafe-inline' because Leaflet and Tailwind utilities set
#               inline styles; Google Fonts serves the stylesheet.
#   connect-src 'self' only: the browser talks to this origin, and the backend
#               talks to Open-Meteo server-side.
#   img-src     server.arcgisonline.com serves the Leaflet basemap tiles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
