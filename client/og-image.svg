<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#03254c"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle radar circles -->
  <circle cx="950" cy="315" r="120" stroke="#0284c7" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <circle cx="950" cy="315" r="220" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <circle cx="950" cy="315" r="320" stroke="#0284c7" stroke-width="1" stroke-opacity="0.08" fill="none"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="96" height="96" rx="24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <path d="M48 20 C48 20 28 46 28 58 C28 69 37 78 48 78 C59 78 68 69 68 58 C68 46 48 20 48 20 Z" fill="url(#dropGrad)"/>
  </g>

  <!-- Typography -->
  <text x="220" y="205" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">RainDrop <tspan fill="#38bdf8">GIS</tspan></text>
  
  <text x="100" y="320" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Municipal Urban Flood Intelligence</text>
  <text x="100" y="380" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Hyperlocal Ward-Level Inundation Nowcasting &amp; Emergency Dispatch</text>

  <!-- Badge row -->
  <g transform="translate(100, 460)">
    <rect width="210" height="48" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="6" fill="#10b981"/>
    <text x="46" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">XGBoost ML Core</text>

    <rect x="230" width="220" height="48" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="258" cy="24" r="6" fill="#38bdf8"/>
    <text x="276" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">PostGIS Geospatial</text>

    <rect x="470" width="220" height="48" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="498" cy="24" r="6" fill="#f59e0b"/>
    <text x="516" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Real-Time Telemetry</text>
  </g>
</svg>
