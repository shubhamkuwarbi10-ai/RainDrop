<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSight RainDrop Multi-City GIS Nowcasting</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #0f172a; }
        #map { height: 100vh; width: 100vw; }
        #search-box {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            color: white;
        }
        select, input { 
            padding: 10px 14px; 
            font-size: 15px; 
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #38bdf8;
        }
        button { 
            padding: 10px 16px; 
            font-size: 15px; 
            cursor: pointer;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        .popup-content {
            font-family: 'Inter', sans-serif;
        }
        .rain-yes { color: #f87171; font-weight: bold; }
        .rain-no { color: #4ade80; font-weight: bold; }
        .timeseries-list {
            margin-top: 10px;
            padding-left: 0;
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .timeseries-list li {
            padding: 4px 0;
            border-bottom: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
        }
        #dem-legend {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 0.85em;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            max-width: 320px;
        }
    </style>
</head>
<body>
    <div id="search-box">
        <select id="city-select" onchange="selectCity(this.value)">
            <option value="chennai">📍 Chennai (CartoDEM 30m)</option>
            <option value="mumbai">📍 Mumbai (CartoDEM 30m)</option>
            <option value="delhi">📍 Delhi (CartoDEM 30m)</option>
        </select>
        <input type="text" id="location-input" placeholder="Search location in city..." onkeypress="if(event.key === 'Enter') searchLocation()">
        <button onclick="searchLocation()">Search</button>
        <button onclick="showMetricsModal()" style="background: #10b981;">📊 Metrics</button>
    </div>

    <div id="dem-legend">
        <div style="font-weight: 700; color: #38bdf8; margin-bottom: 6px; font-size: 1.05em;" id="legend-title">🗺️ 30m CartoDEM GIS Profile</div>
        <div id="dem-info">Loading CartoDEM summary...</div>
    </div>

    <div id="map"></div>

    <!-- Model Evaluation Modal -->
    <div id="metrics-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:2000; justify-content:center; align-items:center; backdrop-filter:blur(6px);">
        <div style="background:white; border-radius:12px; padding:24px; max-width:620px; width:90%; max-height:85vh; overflow-y:auto; box-shadow:0 20px 40px rgba(0,0,0,0.3);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <h2 style="margin:0; font-size:1.25em; color:#1e293b;">🧪 Model Performance & 2D GIS Verification</h2>
                <button onclick="closeMetricsModal()" style="background:#ef4444; padding:6px 14px; font-size:14px;">✕ Close</button>
            </div>
            <div id="metrics-content" style="font-size:0.9em; color:#334155;">
                Loading model verification parameters...
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const cityConfigs = {
            chennai: {
                name: "Chennai",
                center: [13.0825, 80.2750],
                bounds: [[12.90, 80.10], [13.30, 80.45]],
                zoom: 11
            },
            mumbai: {
                name: "Mumbai",
                center: [19.0760, 72.8777],
                bounds: [[18.90, 72.75], [19.10, 72.95]],
                zoom: 12
            },
            delhi: {
                name: "Delhi",
                center: [28.6139, 77.2090],
                bounds: [[28.40, 76.80], [29.00, 77.40]],
                zoom: 11
            }
        };

        const indiaBounds = L.latLngBounds([6.0, 68.0], [36.0, 97.0]);
        let currentCity = 'chennai';

        const map = L.map('map', {
            zoomControl: false,
            maxBounds: indiaBounds,
            minZoom: 5,
            maxZoom: 18
        }).setView(cityConfigs.chennai.center, cityConfigs.chennai.zoom);

        L.control.zoom({position: 'bottomright'}).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let boundingPolygons = {};
        let marker = null;

        // Draw 2D CartoDEM bounding box overlays for all 3 cities
        Object.keys(cityConfigs).forEach(key => {
            const cfg = cityConfigs[key];
            const rect = L.rectangle(cfg.bounds, {
                color: key === 'chennai' ? '#38bdf8' : (key === 'mumbai' ? '#f59e0b' : '#10b981'),
                weight: 2,
                dashArray: '5, 5',
                fillOpacity: 0.08
            }).addTo(map);
            
            rect.bindTooltip(`30m CartoDEM GIS Grid: ${cfg.name}`, {permanent: false, direction: 'top'});
            boundingPolygons[key] = rect;
        });

        map.on('click', async function(e) {
            getPrediction(e.latlng.lat, e.latlng.lng);
        });

        async function selectCity(cityKey) {
            currentCity = cityKey;
            const cfg = cityConfigs[cityKey];
            map.flyToBounds(cfg.bounds, {padding: [30, 30], duration: 1.2});
            await loadDemSummary(cityKey);
            getPrediction(cfg.center[0], cfg.center[1]);
        }

        async function loadDemSummary(cityKey) {
            try {
                const res = await fetch(`/api/dem/summary?city=${cityKey}`);
                const data = await res.json();
                
                document.getElementById('legend-title').innerText = `🗺️ CartoDEM 30m: ${data.city || cityKey.toUpperCase()}`;
                let infoHtml = `
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;">
                        <div>Elevation (Mean): <strong>${data.elevation_m ? data.elevation_m.mean.toFixed(1) + ' m' : 'N/A'}</strong></div>
                        <div>Slope (Mean): <strong>${data.slope_deg ? data.slope_deg.mean.toFixed(2) + '°' : 'N/A'}</strong></div>
                        <div>Resolution: <strong>${data.grid_resolution_m || 30} m</strong></div>
                        <div>Grid Cells: <strong>${data.dimensions ? data.dimensions.rows + '×' + data.dimensions.cols : 'N/A'}</strong></div>
                    </div>
                    <div style="margin-top:6px; color:#a5f3fc;">Depression Sinks: <strong>${data.depressions_count ? data.depressions_count.toLocaleString() : 'N/A'}</strong></div>
                `;
                document.getElementById('dem-info').innerHTML = infoHtml;
            } catch(e) {
                console.error("DEM summary load error:", e);
            }
        }

        async function searchLocation() {
            const query = document.getElementById('location-input').value;
            if (!query) return;

            try {
                const cfg = cityConfigs[currentCity];
                const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', ' + cfg.name + ', India')}&countrycodes=in`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 13);
                    getPrediction(lat, lon);
                } else {
                    alert(`Location not found in ${cfg.name}!`);
                }
            } catch (err) {
                console.error(err);
                alert('Error searching location');
            }
        }

        async function showMetricsModal() {
            document.getElementById('metrics-modal').style.display = 'flex';
            const contentDiv = document.getElementById('metrics-content');
            contentDiv.innerHTML = 'Fetching verification benchmarks from FastAPI server...';
            try {
                const res = await fetch('/api/metrics');
                const data = await res.json();
                
                let html = `<div style="background:#f8fafc; padding:14px; border-radius:8px; margin-bottom:15px; border:1px solid #e2e8f0;">
                    <strong>Model Name:</strong> ${data.model_name}<br>
                    <strong>Optical Flow Scheme:</strong> ${data.parameters.optical_flow_method}<br>
                    <strong>Advection Engine:</strong> ${data.parameters.advection_method}<br>
                    <strong>Inference Latency:</strong> ${data.parameters.inference_latency_ms} ms
                </div>`;
                
                html += `<h4 style="margin:10px 0 6px 0; color:#0f172a;">Contingency Verification Metrics</h4>`;
                html += `<table style="width:100%; border-collapse:collapse; text-align:left; font-size:0.85em;">
                    <tr style="background:#e2e8f0; border-bottom:2px solid #cbd5e1;">
                        <th style="padding:6px;">Threshold</th>
                        <th style="padding:6px;">CSI (Threat Score)</th>
                        <th style="padding:6px;">POD (Detection)</th>
                        <th style="padding:6px;">FAR (False Alarm)</th>
                        <th style="padding:6px;">RMSE (mm/hr)</th>
                    </tr>`;
                
                const metrics = data.verification_metrics;
                for (const key in metrics) {
                    const m = metrics[key];
                    html += `<tr style="border-bottom:1px solid #e2e8f0;">
                        <td style="padding:6px;"><strong>${m.threshold_mm_hr} mm/hr</strong></td>
                        <td style="padding:6px; color:#0284c7; font-weight:bold;">${m.CSI}</td>
                        <td style="padding:6px; color:#16a34a; font-weight:bold;">${m.POD}</td>
                        <td style="padding:6px; color:#dc2626;">${m.FAR}</td>
                        <td style="padding:6px;">${m.RMSE}</td>
                    </tr>`;
                }
                html += `</table>`;
                contentDiv.innerHTML = html;
            } catch(e) {
                contentDiv.innerHTML = `<span style="color:#ef4444;">Failed to fetch evaluation metrics. Ensure backend server is running.</span>`;
            }
        }

        function closeMetricsModal() {
            document.getElementById('metrics-modal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            selectCity('chennai');
        });

        async function getPrediction(lat, lon) {
            if (marker) map.removeLayer(marker);
            
            marker = L.marker([lat, lon]).addTo(map).bindPopup("<div class='popup-content'>Loading prediction...</div>").openPopup();

            try {
                const response = await fetch(`/api/predict?lat=${lat}&lon=${lon}`);
                const data = await response.json();

                if (response.ok) {
                    let popupContent = `<div class='popup-content' style="min-width: 260px;">`;
                    popupContent += `<h3 style="margin: 0 0 4px 0; color: #1e293b;">Rainfall & Urban Flood Prediction</h3>`;
                    popupContent += `<div style="font-size: 0.8em; color: #64748b; margin-bottom: 6px;">City: <strong>${data.location.city}</strong> (Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)})</div>`;
                    
                    if (data.source) {
                        popupContent += `<div style="font-size: 0.75em; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; font-weight: 500;">🌐 Source: ${data.source}</div>`;
                    }

                    if (data.terrain_profile) {
                        const tp = data.terrain_profile;
                        popupContent += `<div style="margin-bottom: 8px; padding: 6px 8px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; font-size: 0.8em; color: #166534;">
                            <strong>🏔️ CartoDEM Terrain:</strong> Slope: ${tp.slope_deg.toFixed(2)}°, Elev: ${tp.elevation_m.toFixed(1)}m
                        </div>`;
                    }

                    if (data.current_weather) {
                        const cur = data.current_weather;
                        popupContent += `<div style="margin-bottom: 10px; padding: 8px 10px; background: #f1f5f9; border-radius: 6px; font-size: 0.85em; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                            <div><strong>Temp:</strong> ${cur.temperature_c !== null ? cur.temperature_c + '°C' : 'N/A'}</div>
                            <div><strong>Humidity:</strong> ${cur.humidity_pct !== null ? cur.humidity_pct + '%' : 'N/A'}</div>
                            <div><strong>Wind:</strong> ${cur.wind_speed_kmh !== null ? cur.wind_speed_kmh + ' km/h' : 'N/A'}</div>
                            <div><strong>Status:</strong> ${cur.weather_description}</div>
                        </div>`;
                    }

                    if (data.error) {
                        popupContent += `<div style="color:#ef4444; padding: 10px; background: #fee2e2; border-radius: 6px;">${data.error}</div>`;
                    } else {
                        const forecast = data.forecast;
                        let riskColor = '#10b981'; // Green
                        if (forecast.risk_level === 'SEVERE') riskColor = '#991b1b'; // Dark Red
                        else if (forecast.risk_level === 'HIGH') riskColor = '#ef4444'; // Red
                        else if (forecast.risk_level === 'MODERATE') riskColor = '#f59e0b'; // Orange
                        else if (forecast.risk_level === 'LOW') riskColor = '#3b82f6'; // Blue
                        
                        popupContent += `<div style="margin-bottom: 10px; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;">
                            <div style="margin-bottom: 4px;"><strong>Flood Risk:</strong> <span style="color: ${riskColor}; font-weight: bold; padding: 2px 6px; background: ${riskColor}15; border-radius: 4px;">${forecast.risk_level}</span></div>
                            <div><strong>Total Rainfall:</strong> ${forecast.total_rainfall_mm} mm</div>
                            <div><strong>Peak Intensity:</strong> ${forecast.peak_intensity_mm_hr} mm/hr</div>
                            <div style="margin-top: 4px; color: #0284c7;"><strong>Est. Flood Depth:</strong> 🌊 ${forecast.predicted_flood_depth_cm || 0.0} cm</div>
                        </div>`;
                        
                        popupContent += `<div style="font-weight: 600; margin-bottom: 6px;">Rain Expected: ${forecast.rain_predicted ? '<span class="rain-yes">🌧️ YES</span>' : '<span class="rain-no">☀️ NO</span>'}</div>`;
                        
                        if (forecast.timeseries_mm_hr && forecast.timeseries_mm_hr.length > 0) {
                            popupContent += `<div style="font-size: 0.8em; font-weight: bold; color: #475569; margin-top: 8px;">Precipitation Timeline:</div>`;
                            popupContent += `<ul class="timeseries-list">`;
                            const labels = forecast.timeseries_labels || [];
                            forecast.timeseries_mm_hr.forEach((val, idx) => {
                                const label = labels[idx] || `T+${idx+1}`;
                                popupContent += `<li><span>${label}</span> <strong>${val.toFixed(2)} mm</strong></li>`;
                            });
                            popupContent += `</ul>`;
                        }
                    }
                    popupContent += `</div>`;
                    
                    marker.setPopupContent(popupContent);
                } else {
                    marker.setPopupContent(`<div class='popup-content'><span class="rain-yes">Error: ${data.detail || 'Failed to fetch'}</span></div>`);
                }
            } catch (err) {
                console.error(err);
                marker.setPopupContent(`<div class='popup-content'><span class="rain-yes">Network error fetching prediction.</span></div>`);
            }
        }
    </script>
</body>
</html>
