<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>RainDrop · Urban flood estimates for Indian cities</title>
    <meta name="description" content="Hourly rainfall forecasts turned into ward-level flood depth estimates for Chennai, Mumbai, Delhi and three more Indian cities. Estimates, not official warnings.">
    <meta name="keywords" content="urban flood forecasting, GIS nowcasting, PostGIS, flood simulation, emergency response, municipal stormwater">
    <meta name="author" content="RainDrop GIS Technologies">
    <meta name="theme-color" content="#0284c7">
    <link rel="canonical" href="https://raindrop.gis.local/">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/favicon.svg">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://raindrop.gis.local/">
    <meta property="og:title" content="RainDrop · Urban flood estimates for Indian cities">
    <meta property="og:description" content="Check how deep the water is likely to get on your street, and whether you can get through. Model estimates, not official warnings.">
    <meta property="og:image" content="/static/og-image.svg">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://raindrop.gis.local/">
    <meta name="twitter:title" content="RainDrop · Urban flood estimates">
    <meta name="twitter:description" content="Ward-level flood depth estimates for six Indian cities, with the method and its limits stated on every number.">
    <meta name="twitter:image" content="/static/og-image.svg">
    <meta name="twitter:creator" content="@KrishanuBuilds">

    <!-- Preconnect for performance -->
    <!-- The display face is above the fold on every page: fetch it with the HTML. -->
    <link rel="preload" href="/static/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Production Compiled Tailwind CSS (No CDN Warning) -->
    <link rel="stylesheet" href="/static/tailwind.min.css?v=5.1.2" />
    
    <!-- Local Leaflet CSS (Zero third-party storage tracking warnings) -->
    <link rel="stylesheet" href="/static/vendor/leaflet.css" />
    
    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="/static/styles.css?v=5.1.2" />

    <!-- React 18 & ReactDOM 18 UMD (Local Bundled Vendors) -->
    <script src="/static/vendor/react.production.min.js" defer></script>
    <script src="/static/vendor/react-dom.production.min.js" defer></script>

    <!-- Leaflet JS (Local Bundled Vendor) -->
    <script src="/static/vendor/leaflet.js" defer></script>

    <!-- Main Application Script (Loaded with defer for immediate first-frame mount) -->
    <script src="/static/frontend.js?v=5.1.2" defer></script>
</head>
<body class="bg-white text-slate-900 min-h-screen font-sans antialiased m-0 p-0 overflow-x-hidden selection:bg-emerald-600 selection:text-white">
    <div id="root">
        <!-- Initial First-Frame Hero Skeleton (Visually 100% identical to React initial render) -->
        <div class="min-h-screen bg-white text-slate-900 flex flex-col items-center justify-start p-0 m-0 font-sans antialiased w-full overflow-x-hidden">
            <section class="relative w-full h-screen min-h-screen overflow-hidden flex flex-col justify-between shadow-2xl">
                <!-- Background Ambient Layer -->
                <div class="absolute inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
                    <video id="bg-video" autoplay loop muted playsinline preload="none"
                           poster="/static/images/rain-video-poster.webp"
                           data-src="/static/VEDIO/RAIN.mp4"
                           class="w-full h-full object-cover scale-[1.01]"></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-black/75 via-black/30 to-black/85 pointer-events-none"></div>
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.2)_50%,rgba(0,0,0,0.5)_100%)] pointer-events-none"></div>
                </div>

                <!-- Top Header & Navigation -->
                <header class="relative z-30 w-full max-w-7xl mx-auto px-6 sm:px-10 lg:px-14 pt-6 sm:pt-8 pb-4 flex items-center justify-between">
                    <div class="flex items-center gap-2.5 text-white tracking-[0.2em] font-light text-xl sm:text-2xl">
                        <svg width="28" height="28" style="width:28px;height:28px;min-width:28px;" class="w-6 h-6 sm:w-7 sm:h-7 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22V12"></path>
                            <path d="M12 12C12 7.58172 8.41828 4 4 4C4 8.41828 7.58172 12 12 12Z"></path>
                            <path d="M12 15C12 11.134 15.134 8 19 8C19 11.866 15.866 15 12 15Z"></path>
                        </svg>
                        <span class="font-normal tracking-[0.25em]">RAINDROP</span>
                    </div>

                    <nav class="hidden lg:flex items-center space-x-8 text-xs font-semibold tracking-[0.15em] uppercase text-white/90" aria-hidden="true">
                        <span>FORECAST</span>
                        <span class="text-white/70">CITIES</span>
                        <span class="text-white/70">HOW IT WORKS</span>
                        <span class="text-white/70">SAFE ROUTES</span>
                    </nav>

                    <div class="hidden lg:flex items-center" aria-hidden="true">
                        <span class="px-6 py-2.5 rounded-full border border-white/80 text-white text-xs font-semibold tracking-[0.15em] uppercase">
                            LOADING…
                        </span>
                    </div>
                </header>

                <!-- Main Hero Core Content -->
                <div class="relative z-10 w-full max-w-7xl mx-auto px-6 sm:px-10 lg:px-14 my-auto pb-16 sm:pb-20">
                    <div class="max-w-3xl">
                        <h1 class="font-editorial text-5xl sm:text-6xl md:text-7xl lg:text-[95px] leading-[0.95] tracking-[-0.01em] font-bold text-white text-glow">
                            Predict Floods.<br>Protect Cities.
                        </h1>
                        <p class="mt-4 sm:mt-6 text-base sm:text-lg md:text-xl text-white/90 font-medium max-w-lg leading-relaxed text-glow">
                            See how deep the water is likely to get on your street, and whether you can get
                            through. Model estimates, not official warnings.
                        </p>
                        <div class="mt-7 sm:mt-9 flex items-center" aria-busy="true">
                            <span class="inline-flex items-center justify-center px-8 py-4 min-h-[48px] bg-white/90 text-black font-semibold text-sm tracking-wide rounded-md shadow-xl">
                                Loading…
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Bottom-Right Information Bar -->
                <div class="absolute bottom-0 right-0 z-30 bg-white text-black px-6 sm:px-10 py-4 sm:py-5 rounded-tl-[24px] flex items-center gap-3 shadow-2xl">
                    <svg width="24" height="24" style="width:24px;height:24px;" class="absolute bottom-0 -left-[24px] w-6 h-6 text-white pointer-events-none" viewBox="0 0 24 24" fill="none">
                        <path d="M0,24 A24,24 0 0,0 24,0 L24,24 Z" fill="currentColor"></path>
                    </svg>
                    <svg width="20" height="20" style="width:20px;height:20px;min-width:20px;" class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-700 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22V12"></path>
                        <path d="M12 12C12 7.58172 8.41828 4 4 4C4 8.41828 7.58172 12 12 12Z"></path>
                        <path d="M12 15C12 11.134 15.134 8 19 8C19 11.866 15.866 15 12 15Z"></path>
                    </svg>
                    <div class="flex items-center gap-2 sm:gap-3 text-xs font-semibold tracking-[0.12em] uppercase text-black">
                        <span>HOURLY FORECAST</span>
                        <span class="text-black/40">•</span>
                        <span>WARD-LEVEL ESTIMATES</span>
                        <span class="text-black/40">•</span>
                        <span>6 INDIAN CITIES</span>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!--
      No inline scripts: the CSP is script-src 'self'. The pre-render skeleton
      above shows only the poster; HeroView decides whether to attach the
      background video once React mounts.
    -->
</body>
</html>
