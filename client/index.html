<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainDrop · Multi-City GIS Urban Flood Nowcasting</title>
    <script>try{localStorage.clear();sessionStorage.clear();}catch(e){}</script>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        script: ['Caveat', 'cursive'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="/static/styles.css" />

    <!-- React 18 & ReactDOM 18 UMD (cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-base-200 text-base-content min-h-screen font-sans">
    <div id="root">
        <!-- React Mounting Point -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f8fafc; color: #1e3a8a;">
            <div style="font-size: 24px; font-weight: 800; color: #0284c7; margin-bottom: 8px;">RainDrop GIS</div>
            <div>Loading Public Safety Urban Flood Intelligence Workspace...</div>
        </div>
    </div>

    <!-- Application Script Loader -->
    <script>
        (function() {
            function loadApp() {
                // First try loading pre-transpiled frontend.js for instant execution
                var script = document.createElement('script');
                script.src = '/static/frontend.js?v=' + Date.now();
                script.onload = function() {
                    console.log("RainDrop pre-compiled JS loaded successfully.");
                };
                script.onerror = function() {
                    console.warn("frontend.js unavailable, falling back to runtime JSX transpilation...");
                    var babelScript = document.createElement('script');
                    babelScript.src = 'https://unpkg.com/@babel/standalone/babel.min.js';
                    babelScript.onload = function() {
                        fetch('/static/frontend.jsx?t=' + Date.now())
                            .then(function(res) { return res.text(); })
                            .then(function(source) {
                                var transpiled = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code;
                                var fn = new Function('React', 'ReactDOM', transpiled);
                                fn(window.React, window.ReactDOM);
                            });
                    };
                    document.head.appendChild(babelScript);
                };
                document.body.appendChild(script);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadApp);
            } else {
                loadApp();
            }
        })();
    </script>
</body>
</html>
