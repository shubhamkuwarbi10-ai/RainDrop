# Rate-limit zones. Declared at http level (conf.d is inside http).
#   api    - general read traffic, 20 req/s per IP with a burst.
#   login  - operator sign-in, deliberately slow: 1 req/s, burst 5.
limit_req_zone $binary_remote_addr zone=raindrop_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=raindrop_login:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=raindrop_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Request body caps. The API accepts radar grids, which are large but bounded.
    client_max_body_size 8m;
    client_body_timeout  30s;
    client_header_timeout 15s;
    limit_conn raindrop_conn 24;

    # Do not advertise the nginx patch version.
    server_tokens off;

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    location = /privacy {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /privacy.html =404;
    }

    location = /terms {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /terms.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /sitemap.xml =404;
    }

    # ─── Static frontend ──────────────────────────────────────
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fingerprinted assets can be cached hard; HTML above cannot.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ─── Operator sign-in ─────────────────────────────────────
    # Tighter limit than the rest of the API: this is the credential endpoint.
    location /api/auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=raindrop_login burst=5 nodelay;
        proxy_pass         http://backend:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── Backend API ──────────────────────────────────────────
    location /api/v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=raindrop_api burst=40 nodelay;
        proxy_pass         http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=raindrop_api burst=40 nodelay;
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        proxy_pass       http://backend:8000/health;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;
}

# ─────────────────────────────────────────────────────────────
