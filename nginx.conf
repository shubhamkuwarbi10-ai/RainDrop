server {
    listen 80;
    server_name _;

    # ─── Static Frontend (client/) ───────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend root
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets alias (/static/* mapped to /usr/share/nginx/html/*)
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ─── Backend PostGIS API Proxy ────────────────────────────
    # /api/v1/* goes to FastAPI PostGIS backend on port 8001
    location /api/v1/ {
        proxy_pass         http://backend:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── ML & GIS Server API Proxy ────────────────────────────
    # /api/* (like /api/ward_forecast, /api/telemetry_status, etc.) goes to ML server on port 8000
    location /api/ {
        proxy_pass         http://ml-server:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check proxies
    location /health {
        proxy_pass         http://ml-server:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health/backend {
        proxy_pass         http://backend:8001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ─── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"    always;

    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
