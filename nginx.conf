server {
    listen 80;
    server_name _;

    # ─── Static Frontend (client/) ───────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Clean URL aliases for legal docs
    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }


    # Robots & Sitemap
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    # Serve static frontend root
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets alias (/static/* mapped to /usr/share/nginx/html/*)
    location /static/ {
        alias /usr/share/nginx/html/;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── Backend PostGIS API Proxy ────────────────────────────
    location /api/v1/ {
        proxy_pass         http://backend:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── ML & GIS Server API Proxy ────────────────────────────
    location /api/ {
        proxy_pass         http://ml-server:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check proxies
    location /health {
        proxy_pass         http://ml-server:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health/backend {
        proxy_pass         http://backend:8001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ─── Security & HTTPS Headers ─────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(self), microphone=(), camera=()" always;

    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;
}

