services:
  # ─────────────────────────────────────────────
  # ML / GIS Server (RandomForest surrogate + GeoTIFF terrain)
  # ─────────────────────────────────────────────
  ml-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raindrop-ml-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount processed GeoTIFF rasters so the ML model can read terrain data
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./client:/app/client:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Frontend (Nginx serving static client/)
  # ─────────────────────────────────────────────
  frontend:
    image: nginx:1.25-alpine
    container_name: raindrop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-server
