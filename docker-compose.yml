services:
  # ─────────────────────────────────────────────
  # PostGIS Database
  # ─────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: raindrop-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raindrop}
      POSTGRES_USER: ${POSTGRES_USER:-raindrop}
      # No default. Compose refuses to start if POSTGRES_PASSWORD is unset,
      # which is the point: the old fallback of "postgres" shipped to production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # Reachable only from the compose network. Publishing 5432 exposed the
    # database to the internet, and a published port bypasses ufw entirely.
    expose:
      - "5432"
    volumes:
      - raindrop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raindrop} -d ${POSTGRES_DB:-raindrop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend API (FastAPI + PostGIS + GIS/ML)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raindrop-backend
    restart: unless-stopped
    # Not published. Clients reach the API through nginx, which applies the
    # rate limits, body-size caps and security headers.
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RAINDROP_ENV=${RAINDROP_ENV:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-raindrop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raindrop}
      - RAINDROP_SESSION_SECRET=${RAINDROP_SESSION_SECRET:?RAINDROP_SESSION_SECRET must be set in .env}
      - RAINDROP_INGEST_KEY=${RAINDROP_INGEST_KEY:?RAINDROP_INGEST_KEY must be set in .env}
      - RAINDROP_SESSION_COOKIE_SECURE=${RAINDROP_SESSION_COOKIE_SECURE:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./client:/app/client:ro
      # Operator credentials are written by the admin CLI and read at login.
      - raindrop_state:/app/data/state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Frontend (nginx serving client/ and proxying the API)
  # ─────────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: raindrop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment once certificates are mounted; see nginx.conf.
      # - "443:443"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  raindrop_pgdata:
  raindrop_state:
